<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost + Found — MIDI Editor</title>
  <meta name="description" content="MIDI Editor for Chase Bliss Lost + Found pedal">
</head>

<body>
  <div id="buildBadge">BUILD: v2.0.0 • TypeScript</div>

  <div class="layout">
    <div class="card">
      <!-- Topbar -->
      <div class="topbar">
        <!-- Group: MIDI & Tempo -->
        <div class="tbGroup">
          <button id="btnEnableMIDI">Enable MIDI</button>
          <select id="midiSelect" disabled>
            <option value="">MIDI Output</option>
          </select>
          <label class="pillLabel">
            <span>Ch</span>
            <select id="chanSelect" disabled></select>
          </label>


          <div class="sep"></div>

          <button id="btnTap" disabled>Tap</button>
          <span id="tapReadout" class="sub" style="font-variant: tabular-nums; min-width: 45px;">—</span>
        </div>

        <!-- Group: Random -->
        <div class="tbGroup">
          <span class="grpLabel">Random:</span>
          <div class="segmented">
            <button id="btnRandom"
              title="Randomize All (Excludes: Wet, Clock, Latch, Trails, Bank, MISO, Spread, Bounce/Sweep/Polarity, Ramp Enabled)">All</button>
            <button id="btnRandomKnobs"
              title="Randomize Knobs Only (Excludes Master Wet and locked knobs)">Knobs</button>
          </div>
          <label class="pillLabel compact" title="Include Ramp Controls in Random All">
            <input id="chkInclRamp" type="checkbox" class="toggleSwitch toggleSwitch--sm">
            <span>+Ramp</span>
          </label>
          <span id="btnUnlockAll" title="Unlock All Knobs"
            style="cursor: pointer; margin-left: 6px; font-size: 16px; user-select: none;">🔓</span>
        </div>

        <!-- Group: Presets -->
        <div class="tbGroup">
          <span class="grpLabel">Preset:</span>
          <label class="pillLabel">
            <select id="slotSelect"></select>
          </label>
          <div class="segmented">
            <button id="btnRecall">Recall</button>
            <button id="btnStore">Store</button>
          </div>
          <button id="btnShowManager" title="Open Preset Manager"
            style="padding: 5px 10px; font-size: 11px;">Manage</button>
        </div>

        <!-- Group: File & Warning -->
        <div class="tbGroup">
          <button id="btnPushOnly" title="Send Settings to Pedal"
            style="margin-left: 4px; border-left: 1px solid rgba(0,0,0,0.1); padding-left: 8px;">Push</button>

          <div id="cloudStatus"
            style="font-size: 10px; color: var(--cream-muted); display: flex; align-items: center; gap: 6px; opacity: 0.8; user-select: none; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 8px; margin-left: 4px;"
            title="Tracks local changes vs Cloud backup. Enabled Auto-Sync for real-time backup.">
            <span id="cloudStatusDot"
              style="width: 6px; height: 6px; border-radius: 50%; background: #666; transition: background 0.3s; border: 1px solid rgba(255,255,255,0.1);"></span>
            <span id="cloudStatusText">Cloud Offline</span>
          </div>
        </div>
      </div>

      <!-- Name Modal -->
      <div id="nameModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999999; align-items:center; justify-content:center; backdrop-filter:blur(6px);">
        <div class="card" style="width:300px; padding:20px; display:flex; flex-direction:column; gap:12px;">
          <h3 style="margin:0; font-size:16px;">Store Preset <span id="storeSlotLabel"
              style="font-size:12px; color:var(--cream-muted); margin-left:8px;"></span></h3>
          <input type="text" id="customNameInput"
            style="padding:8px; border-radius:8px; border:1px solid var(--border);" placeholder="Enter name...">
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="pmBtn secondary"
              onclick="document.getElementById('nameModal').style.display='none'">Cancel</button>
            <button class="pmBtn primary" id="btnConfirmName">Save</button>
          </div>
        </div>
      </div>

      <!-- Pedal Interface -->
      <div class="pedal">
        <!-- Effect Toggles -->
        <div class="toggleRow" id="toggleRow"></div>

        <!-- Ramping Control Section -->
        <div class="rampSection">
          <div class="rampHeader" id="rampHeader">
            <span>Ramping Control</span>
            <button class="rampCollapseBtn" id="rampCollapseBtn">Show</button>
          </div>
          <div class="rampControls collapsed" id="rampControls">
            <div class="rampToggles" id="rampToggles"></div>
            <div class="rampSliderWrap" id="rampSliderWrap"></div>
            <label class="rampToggle" id="rampEnabledWrap"></label>
          </div>
        </div>

        <!-- Knob Grid -->
        <div class="knobGrid" id="knobGrid"></div>
      </div>

      <!-- Advanced Settings Area -->
      <div class="advancedArea">
        <div class="settingsModule">
          <div class="moduleHeader">Stereo</div>
          <div class="stereoControls" id="stereoControls"></div>
        </div>

        <div class="settingsModule">
          <div class="moduleHeader">Clock / Tempo</div>
          <div class="advGrid" id="otherGrid"></div>
        </div>

        <div class="settingsModule">
          <div class="moduleHeader">General Settings</div>
          <div class="dipGrid" id="dipGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Preset Manager Modal -->
  <div id="pmModal">
    <div id="pmContent">
      <div
        style="display:flex; justify-content:space-between; align-items:flex-start; flex-shrink: 0; margin-bottom: 8px;">
        <div>
          <h3 style="margin:0; font-size:18px; font-weight:800; color: var(--text);">Manage Presets</h3>
          <p style="font-size: 11px; color: #777; margin: 4px 0 0;">Library backup includes names and [x] status. It
            does not include knob values.</p>
        </div>
        <button class="pmBtn secondary" style="padding: 4px 10px; border-radius: 8px; font-size: 14px;"
          onclick="document.getElementById('pmModal').style.display='none'">✕</button>
      </div>
      <div class="pmTableContainer">
        <table class="pmTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th title="Mark as occupied in the dropdown">Used</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="pmTableBody"></tbody>
        </table>
      </div>

      <div
        style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding-top:16px; margin-top:auto; flex-shrink: 0;">
        <div style="display:flex; flex-direction: column; gap: 8px;">
          <div style="display:flex; gap:8px; align-items: center;">
            <span
              style="font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; width: 60px;">Library</span>
            <button id="btnExportMeta" class="pmBtn secondary">Export</button>
            <button id="btnImportMeta" class="pmBtn secondary">Import</button>
            <div id="pmCloudActions" style="margin-left: 4px;"></div>
          </div>
          <div style="display:flex; gap:8px; align-items: center;">
            <span
              style="font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; width: 60px;">Pattern</span>
            <button id="btnExportPreset" class="pmBtn secondary" title="Export Current Pattern to File">Export</button>
            <button id="btnImportPreset" class="pmBtn secondary" title="Import Pattern from File">Import</button>
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="pmBtn secondary"
            onclick="document.getElementById('pmModal').style.display='none'">Cancel</button>
          <button id="btnSaveManager" class="pmBtn primary">Save All Changes</button>
        </div>
      </div>
      <input id="fileMeta" type="file" accept="application/json,.json" style="display:none">
      <input id="filePreset" type="file" accept="application/json,.json" style="display:none">
    </div>
  </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
